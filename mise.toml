[tools]
python = "3.11"
uv = "0.8.23"
# dev toolchain; Cargo.toml's rust-version=1.89 is the lib's MSRV, but the
# examples' aws-sdk crates need >=1.94.1 to compile
rust = "1.98.1"

[env]
UV_PYTHON_PREFERENCE = "only-system"
# testcontainers must mount the docker socket as the daemon's VM sees it (colima:
# host path from DOCKER_HOST doesn't exist inside the VM). Keeps Ryuk crash-cleanup alive.
TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE = "/var/run/docker.sock"
# cargo test binaries link libpython by mise-python's baked-in /install/... name;
# let dyld fall back to the real location
DYLD_FALLBACK_LIBRARY_PATH = "/Users/trust/.local/share/mise/installs/python/3.11/lib"
